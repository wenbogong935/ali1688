<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <div class="btn-group" id="toolbar">
            <a class="btn btn-primary btn-add {:$auth->check('bom/material_usage/add')?'':'hide'}"
               title="{:__('Add')}" href="javascript:;">
                <i class="fa fa-plus"></i> {:__('Add')}
            </a>
            <a class="btn btn-primary btn-edit btn-disabled disabled {:$auth->check('bom/material_usage/edit')?'':'hide'}"
               title="{:__('Edit')}" href="javascript:;">
                <i class="fa fa-pencil"></i> {:__('Edit')}
            </a>
            <a class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('bom/material_usage/del')?'':'hide'}"
               title="{:__('Delete')}" href="javascript:;">
                <i class="fa fa-trash"></i> {:__('Delete')}
            </a>
            <a class="btn btn-warning btn-batch-assign" title="批量分配材料" href="javascript:;">
                <i class="fa fa-tasks"></i> 批量分配
            </a>
            <a class="btn btn-info btn-cost-preview btn-disabled disabled" title="成本预览" href="javascript:;">
                <i class="fa fa-calculator"></i> 成本预览
            </a>
            <div class="dropdown btn-group {:$auth->check('bom/material_usage/multi')?'':'hide'}">
                <a class="btn btn-primary btn-more dropdown-toggle btn-disabled disabled" data-toggle="dropdown">
                    <i class="fa fa-cog"></i> {:__('More')}
                </a>
                <ul class="dropdown-menu text-left" role="menu">
                    <li><a class="btn btn-link btn-multi btn-disabled disabled" href="javascript:;" data-params="status=normal">
                        <i class="fa fa-eye"></i> {:__('Set to normal')}
                    </a></li>
                    <li><a class="btn btn-link btn-multi btn-disabled disabled" href="javascript:;" data-params="status=hidden">
                        <i class="fa fa-eye-slash"></i> {:__('Set to hidden')}
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="panel-body">
        <div class="alert alert-info" style="margin-bottom: 15px;">
            <i class="fa fa-info-circle"></i>
            <strong>材料使用管理</strong> - 定义部件如何使用原材料，包括尺寸计算、成本分摊和工艺参数
        </div>
        <div class="row">
            <div class="col-xs-12">
                <table id="table" class="table table-striped table-bordered table-hover table-nowrap" 
                       data-operate-edit="{:$auth->check('bom/material_usage/edit')}"
                       data-operate-del="{:$auth->check('bom/material_usage/del')}"
                       width="100%">
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 公式格式化模板 -->
<script type="text/html" id="formulatpl">
{{# if(d.FAT_FIELD_NAME && d.FAT_FIELD_NAME !== '0') { }}
    {{# if(d.FAT_FIELD_NAME.startsWith('=')) { }}
        <code class="text-primary"><i class="fa fa-calculator"></i> {{# d.FAT_FIELD_NAME }}</code>
    {{# } else { }}
        <strong class="text-success"><i class="fa fa-arrows-alt"></i> {{# d.FAT_FIELD_NAME }}</strong>
    {{# } }}
{{# } else { }}
    <span class="text-muted"><i class="fa fa-minus"></i> 未设置</span>
{{# } }}
</script>

<!-- 拼版数模板 -->
<script type="text/html" id="paneltpl">
{{# if(d.panel && d.panel > 1) { }}
    <span class="label label-info"><i class="fa fa-clone"></i> {{# d.panel }}</span>
{{# } else { }}
    <span class="text-muted">1</span>
{{# } }}
</script>

<!-- 覆盖属性模板 -->
<script type="text/html" id="overridetpl">
{{# if(d.FAT_FIELD_NAME) { }}
    <strong class="text-warning"><i class="fa fa-wrench"></i> {{# d.FAT_FIELD_NAME }}{{# d.FAT_UNIT }}</strong>
{{# } else { }}
    <span class="text-muted">默认</span>
{{# } }}
</script>

<!-- 材料类型标签模板 -->
<script type="text/html" id="materialtypetpl">
{{# var typeMap = {
    'paper': {label: 'label-info', icon: 'fa-file-o', text: '纸类'},
    'plastic': {label: 'label-warning', icon: 'fa-cube', text: '塑料'},
    'metal': {label: 'label-primary', icon: 'fa-gears', text: '金属'},
    'wood': {label: 'label-success', icon: 'fa-tree', text: '木材'},
    'glass': {label: 'label-default', icon: 'fa-eye', text: '玻璃'},
    'ceramic': {label: 'label-danger', icon: 'fa-circle', text: '陶瓷'},
    'textile': {label: 'label-purple', icon: 'fa-scissors', text: '纺织'},
    'chemical': {label: 'label-yellow', icon: 'fa-flask', text: '化学'},
    'other': {label: 'label-default', icon: 'fa-question', text: '其他'}
}; }}
{{# var type = typeMap[d.FAT_FIELD_NAME] || typeMap['other']; }}
<span class="label {{# type.label }}">
    <i class="fa {{# type.icon }}"></i> {{# type.text }}
</span>
</script>
