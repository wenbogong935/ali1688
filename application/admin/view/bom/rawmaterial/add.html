<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" placeholder="请输入材料名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Description')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control" rows="3" name="row[description]" cols="50" placeholder="请输入材料描述"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">材料类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-type" data-rule="required" class="form-control selectpicker" name="row[type]">
                <option value="">请选择材料类型</option>
                {volist name="typeList" id="vo" key="k"}
                <option value="{$k}">{$vo}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">计量单位:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-unit_of_measure" data-rule="required" class="form-control selectpicker" name="row[unit_of_measure]">
                <option value="">请选择计量单位</option>
                {volist name="unitOfMeasureList" id="vo" key="k"}
                <option value="{$k}">{$vo}</option>
                {/volist}
            </select>
            <span class="help-block">影响成本计算方式</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单位成本:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-unit_cost" data-rule="required;number" class="form-control" name="row[unit_cost]" type="number" step="0.01" placeholder="请输入单位成本">
            <span class="help-block">按所选计量单位的成本</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">标准长度(cm):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-standard_length" class="form-control" name="row[standard_length]" type="number" step="0.01" placeholder="材料标准长度">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">标准宽度(cm):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-standard_width" class="form-control" name="row[standard_width]" type="number" step="0.01" placeholder="材料标准宽度">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">标准高度(cm):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-standard_height" class="form-control" name="row[standard_height]" type="number" step="0.01" placeholder="材料标准高度">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">克重(gsm):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-gsm" class="form-control" name="row[gsm]" type="number" step="0.01" placeholder="材料克重">
            <span class="help-block">纸张材料通常需要设置</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">厚度(mm):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-thickness" class="form-control" name="row[thickness]" type="number" step="0.01" placeholder="材料厚度">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">密度(g/cm³):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-density" class="form-control" name="row[density]" type="number" step="0.001" placeholder="材料密度">
            <span class="help-block">用于重量计算</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">供应商:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-supplier" class="form-control" name="row[supplier]" type="text" placeholder="供应商名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="2" name="row[notes]" cols="50" placeholder="材料相关备注"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <div class="col-xs-12 col-sm-8 col-sm-offset-2">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
