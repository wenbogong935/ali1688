<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">成本类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-cost_type" data-rule="required" class="form-control selectpicker" name="row[cost_type]">
                {foreach name="costTypeList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">成本单位:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-unit_of_cost" data-rule="required" class="form-control selectpicker" name="row[unit_of_cost]">
                {foreach name="unitOfCostList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">成本费率:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cost_rate" class="form-control" step="0.000001" name="row[cost_rate]" type="number" value="0.000000">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">设置成本:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-setup_cost" class="form-control" step="0.000001" name="row[setup_cost]" type="number" value="0.000000">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产能效率:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-throughput_rate" class="form-control" step="0.000001" name="row[throughput_rate]" type="number" value="0.000000">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">人工费率/小时:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-labor_rate_per_hour" class="form-control" step="0.000001" name="row[labor_rate_per_hour]" type="number" value="0.000000">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">损耗百分比(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-waste_percentage" class="form-control" step="0.01" name="row[waste_percentage]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="5" name="row[notes]" cols="50"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
