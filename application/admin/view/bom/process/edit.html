<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name|htmlentities}" placeholder="请输入工艺名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Description')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control" rows="3" name="row[description]" cols="50" placeholder="请输入工艺描述">{$row.description|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">成本类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-cost_type" data-rule="required" class="form-control selectpicker" name="row[cost_type]" onchange="Controller.api.updateCostFields(this.value)">
                <option value="">请选择成本类型</option>
                {volist name="costTypeList" id="vo" key="k"}
                <option value="{$k}" {eq name="k" value="$row.cost_type"}selected{/eq}>{$vo}</option>
                {/volist}
            </select>
            <span class="help-block">不同类型的成本计算方式不同</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">成本单位:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-unit_of_cost" data-rule="required" class="form-control selectpicker" name="row[unit_of_cost]">
                <option value="">请选择成本单位</option>
                {volist name="unitOfCostList" id="vo" key="k"}
                <option value="{$k}" {eq name="k" value="$row.unit_of_cost"}selected{/eq}>{$vo}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">费率:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-rate" data-rule="required;number" class="form-control" name="row[rate]" type="number" step="0.01" value="{$row.rate}" placeholder="请输入费率">
            <span class="help-block">基础费率，用于成本计算</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">设置费:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-setup_cost" class="form-control" name="row[setup_cost]" type="number" step="0.01" value="{$row.setup_cost}" placeholder="请输入设置费">
            <span class="help-block">一次性设置费用</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">吞吐率:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-throughput_rate" class="form-control" name="row[throughput_rate]" type="number" step="0.01" value="{$row.throughput_rate}" placeholder="请输入吞吐率">
            <span class="help-block">处理效率，影响时间成本计算</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">损耗率(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-waste_rate" class="form-control" name="row[waste_rate]" type="number" step="0.01" value="{$row.waste_rate}" placeholder="请输入损耗率">
            <span class="help-block">工艺损耗百分比，0-100之间</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <div class="col-xs-12 col-sm-8 col-sm-offset-2">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
