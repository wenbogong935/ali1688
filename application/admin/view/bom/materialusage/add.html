<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="alert alert-info">
        <i class="fa fa-info-circle"></i> 
        <strong>提示：</strong>材料使用定义了部件如何使用特定原材料，包括尺寸计算公式和成本分摊规则。
    </div>
    
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">
            <span class="text-danger">*</span>部件:
        </label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-component_id" data-rule="required" class="form-control selectpicker" 
                    name="row[component_id]" data-live-search="true" 
                    data-live-search-placeholder="搜索部件名称或产品名称">
                <option value="">请选择部件</option>
                {volist name="componentList" id="vo" key="k"}
                <option value="{$k}">{$vo}</option>
                {/volist}
            </select>
            <span class="help-block"><i class="fa fa-search"></i> 可搜索部件名称或所属产品名称</span>
        </div>
    </div>
    
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">
            <span class="text-danger">*</span>原材料:
        </label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-raw_material_id" data-rule="required" class="form-control selectpicker" 
                    name="row[raw_material_id]" data-live-search="true" 
                    data-live-search-placeholder="搜索原材料名称">
                <option value="">请选择原材料</option>
                {volist name="rawMaterialList" id="vo" key="k"}
                <option value="{$k}">{$vo}</option>
                {/volist}
            </select>
            <span class="help-block"><i class="fa fa-cube"></i> 选择后将显示材料属性信息</span>
        </div>
    </div>
    
    <div class="panel panel-default">
        <div class="panel-heading">
            <h5 class="panel-title">
                <i class="fa fa-calculator"></i> 尺寸计算公式
            </h5>
        </div>
        <div class="panel-body">
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="control-label">长度公式:</label>
                        <div class="formula-input-group">
                            <input id="c-length_formula" class="form-control formula-input" 
                                   name="row[length_formula]" type="text" 
                                   placeholder="如: 100 或 =L+10">
                            <div class="formula-help" style="display:none;">
                                <small class="text-muted">
                                    <i class="fa fa-lightbulb-o"></i>
                                    支持公式: =L+10, =L*0.8, =(L+W)/2<br>
                                    或固定值: 100, 210
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="control-label">宽度公式:</label>
                        <div class="formula-input-group">
                            <input id="c-width_formula" class="form-control formula-input" 
                                   name="row[width_formula]" type="text" 
                                   placeholder="如: 100 或 =W+10">
                            <div class="formula-help" style="display:none;">
                                <small class="text-muted">
                                    <i class="fa fa-lightbulb-o"></i>
                                    可引用父级L、W、H变量进行计算
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="control-label">高度公式:</label>
                        <div class="formula-input-group">
                            <input id="c-height_formula" class="form-control formula-input" 
                                   name="row[height_formula]" type="text" 
                                   placeholder="如: 2 或 =H">
                            <div class="formula-help" style="display:none;">
                                <small class="text-muted">
                                    <i class="fa fa-lightbulb-o"></i>
                                    通常用于材料厚度或层数
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="panel panel-default">
        <div class="panel-heading">
            <h5 class="panel-title">
                <i class="fa fa-cogs"></i> 生产参数
            </h5>
        </div>
        <div class="panel-body">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="control-label">拼版数:</label>
                        <input id="c-panel" class="form-control" name="row[panel]" 
                               type="number" step="1" min="1" value="1" 
                               placeholder="请输入拼版数">
                        <span class="help-block">
                            <i class="fa fa-info"></i> 用于成本分摊计算，默认为1
                        </span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="control-label">排序:</label>
                        <input id="c-sequence" data-rule="required;integer" class="form-control" 
                               name="row[sequence]" type="number" value="100" 
                               placeholder="请输入排序值">
                        <span class="help-block">
                            <i class="fa fa-sort"></i> 数字越小越靠前显示
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="panel panel-default">
        <div class="panel-heading">
            <h5 class="panel-title">
                <i class="fa fa-wrench"></i> 材料属性覆盖 <small class="text-muted">（可选）</small>
            </h5>
        </div>
        <div class="panel-body">
            <div class="alert alert-warning">
                <i class="fa fa-warning"></i>
                <strong>注意：</strong>以下设置将覆盖原材料的默认属性，留空则使用材料默认值。
            </div>
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="control-label">克重覆盖 (gsm):</label>
                        <input id="c-gsm_override" class="form-control" 
                               name="row[gsm_override]" type="number" step="0.01" 
                               placeholder="覆盖默认克重">
                        <span class="help-block">
                            <i class="fa fa-balance-scale"></i> 单位：克/平方米
                        </span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="control-label">厚度覆盖 (mm):</label>
                        <input id="c-thickness_override" class="form-control" 
                               name="row[thickness_override]" type="number" step="0.01" 
                               placeholder="覆盖默认厚度">
                        <span class="help-block">
                            <i class="fa fa-arrows-v"></i> 单位：毫米
                        </span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="control-label">密度覆盖 (g/cm³):</label>
                        <input id="c-density_override" class="form-control" 
                               name="row[density_override]" type="number" step="0.01" 
                               placeholder="覆盖默认密度">
                        <span class="help-block">
                            <i class="fa fa-compress"></i> 单位：克/立方厘米
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="form-group layer-footer">
        <div class="col-xs-12 col-sm-8 col-sm-offset-2">
            <button type="submit" class="btn btn-success btn-embossed disabled">
                <i class="fa fa-check"></i> {:__('OK')}
            </button>
            <button type="reset" class="btn btn-default btn-embossed">
                <i class="fa fa-refresh"></i> {:__('Reset')}
            </button>
        </div>
    </div>
</form>
