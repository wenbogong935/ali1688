<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">部件:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-component_id" data-rule="required" class="form-control selectpicker" name="row[component_id]">
                <option value="">请选择部件</option>
                {foreach name="componentList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">原材料:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-raw_material_id" data-rule="required" class="form-control selectpicker" name="row[raw_material_id]">
                <option value="">请选择原材料</option>
                {foreach name="rawMaterialList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">别名:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-alias" class="form-control" name="row[alias]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">长度公式:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-length_formula" class="form-control" name="row[length_formula]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">宽度公式:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-width_formula" class="form-control" name="row[width_formula]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">克重覆盖:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-grammage_override" class="form-control" step="0.01" name="row[grammage_override]" type="number" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">厚度覆盖(mm):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-thickness_override_mm" class="form-control" step="0.01" name="row[thickness_override_mm]" type="number" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">拼版数量:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-imposition_quantity" class="form-control" name="row[imposition_quantity]" type="number" value="1">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sequence" class="form-control" name="row[sequence]" type="number" value="0">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
